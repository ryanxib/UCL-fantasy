name: key_check
on:
  push:
    branches: [main]
    paths: [scripts/check_odds_key.py, .github/workflows/key_check.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API }}
        run: python scripts/check_odds_key.py
      - if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data/ref/odds_key_check.md
          git commit -q -m "Odds API key check" || exit 0
          git pull -q --rebase && git push -q
