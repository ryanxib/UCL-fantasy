name: props
# Copied from ryanxib/epl.dfs .github/workflows/props.yml (commit efa3cb9), adapted for UCL.
# Odds API credits are SHARED with nba.dfs and epl.dfs. About 21 credits per game + 4 per run (see scripts/fetch_props.py).
# Player props post about a day before kick-off: run on the day (or the evening before).
# Two ways to run: Actions -> props -> Run workflow, or commit a change to requests/props.txt (Claude's route:
# this workspace cannot call the Actions API). requests/props.txt holds the arguments, e.g. "--hours 30" or "--hours 30 --no-extra".
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments for fetch_props.py (e.g. --hours 30, --no-extra, --no-team)"
        default: "--hours 30"
  push:
    branches: [main]
    paths: [requests/props.txt]
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas
      - name: Fetch props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API }}
          INPUT_ARGS: ${{ github.event.inputs.args }}
        run: |
          mkdir -p data/raw/props
          ARGS="${INPUT_ARGS:-$(head -1 requests/props.txt 2>/dev/null)}"
          # allow only the known flags and numbers (public repo: nothing else reaches the shell)
          echo "$ARGS" | grep -Eq '^( *(--hours [0-9]{1,3}|--no-extra|--no-team))* *$' || { echo "bad args: $ARGS" | tee data/raw/props/last_run.txt; exit 1; }
          python scripts/fetch_props.py $ARGS 2>&1 | tee data/raw/props/last_run.txt; exit ${PIPESTATUS[0]}
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data
          git commit -q -m "Props $(date -u +'%F %H:%M')Z" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
